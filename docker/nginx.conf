server {
    listen 80 default_server;
    server_name _;

    # Landing page — try_files avoids the internal redirect that index causes
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Redirect /dashboard (and any subpath) to the daemon port
    location /dashboard {
        return 302 http://$host:8000/;
    }

    # Redirect /editor (and any subpath) to code-server port
    location /editor {
        return 302 http://$host:8080/;
    }
}
