map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # ── Landing page (exact match only — everything else falls through) ──
    location = / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # ── Dashboard (/dashboard/ → daemon :8000, prefix stripped) ─────────
    location = /dashboard { return 301 /dashboard/; }
    location /dashboard/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # ── Code editor (/editor/ → code-server :8080) ───────────────────────
    location = /editor { return 301 /editor/; }
    location /editor/ {
        proxy_pass         http://127.0.0.1:8080/editor/;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Camera MJPEG (unbuffered streaming) ──────────────────────────────
    location /camera {
        proxy_pass         http://127.0.0.1:8000/camera;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # ── Everything else → daemon (/ws, /assets/, /state, /health …) ─────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
