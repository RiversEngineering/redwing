<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redwing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .wordmark svg { opacity: 0.35; }

    .wordmark-text {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .hostname {
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 0.7rem;
      color: #334155;
      letter-spacing: 0.05em;
    }

    .buttons {
      display: flex;
      gap: 1rem;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1.75rem 2.25rem;
      border-radius: 0.75rem;
      border: 1px solid;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      user-select: none;
      min-width: 9rem;
    }

    .btn:active { transform: scale(0.97); }

    .btn-dashboard {
      background: rgba(59, 130, 246, 0.08);
      border-color: rgba(59, 130, 246, 0.25);
      color: #60a5fa;
    }
    .btn-dashboard:hover {
      background: rgba(59, 130, 246, 0.16);
      border-color: rgba(59, 130, 246, 0.45);
    }

    .btn-editor {
      background: rgba(168, 85, 247, 0.08);
      border-color: rgba(168, 85, 247, 0.25);
      color: #c084fc;
    }
    .btn-editor:hover {
      background: rgba(168, 85, 247, 0.16);
      border-color: rgba(168, 85, 247, 0.45);
    }

    .btn-label {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .btn-sub {
      font-size: 0.6875rem;
      opacity: 0.5;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="wordmark">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
         stroke="#94a3b8" stroke-width="1.2"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="4" height="10" rx="1"/>
      <rect x="10" y="7" width="4" height="10" rx="1"/>
      <rect x="18" y="7" width="4" height="10" rx="1"/>
      <path d="M6 12h4M14 12h4"/>
    </svg>
    <div class="wordmark-text">Redwing</div>
    <div class="hostname" id="host"></div>
  </div>

  <div class="buttons">
    <a href="/dashboard/" class="btn btn-dashboard">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="btn-label">Dashboard</span>
      <span class="btn-sub">Live robot state</span>
    </a>

    <a href="/editor/" class="btn btn-editor">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      <span class="btn-label">Code Editor</span>
      <span class="btn-sub">Write student code</span>
    </a>
  </div>

  <script>
    document.getElementById('host').textContent = location.hostname;
  </script>
</body>
</html>
