version: "3.9"

services:
  daemon:
    image: redwing:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    privileged: false
    devices:
      # RP2040 over USB serial — udev rule creates stable symlink /dev/rp2040
      - /dev/rp2040:/dev/rp2040
      # webcam
      - /dev/video0:/dev/video0
    device_cgroup_rules:
      - "c 166:* rmw"   # ttyACM devices
      - "c 81:* rmw"    # Video4Linux devices
    volumes:
      - student_workspace:/workspace
    environment:
      REDWING_SERIAL: /dev/rp2040
      REDWING_HOST:   "0.0.0.0"
      REDWING_PORT:   "8080"
      REDWING_HZ:     "50"
    ports:
      - "8080:8080"   # dashboard + API
      - "5555:5555"   # ZMQ PUB  (student library)
      - "5556:5556"   # ZMQ PULL
      - "5557:5557"   # ZMQ REP
    network_mode: host   # simplest for classroom WiFi — exposes all ports directly

  code-server:
    image: codercom/code-server:latest
    restart: unless-stopped
    volumes:
      - student_workspace:/home/coder/project
      - /opt/redwing/redwing:/home/coder/redwing:ro   # read-only lib for import
    environment:
      PASSWORD: "redwing"     # change per-robot in ansible vars
    ports:
      - "8443:8080"    # code-server UI (different port from daemon dashboard)
    network_mode: host

volumes:
  student_workspace:
    # This named volume persists student code across container restarts and image updates.
    # It lives on the Pi's filesystem — NOT inside the container.
    driver: local
