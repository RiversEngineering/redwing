name: redwing

services:
  daemon:
    image: redwing-daemon:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Soft memory protection for the robot daemon. On cgroup v2 (modern Pi OS)
    # this maps to memory.low: the daemon's working set up to this size is kept
    # off the reclaim/swap path under memory pressure, so code-server + student
    # code spill to zram first and the camera feed / control loop stay live.
    # It is a soft floor, not a hard cap — nothing is OOM-killed at this value.
    # Left at 0 (no-op) unless REDWING_DAEMON_MEM_RESERVATION is set, which the
    # installer/ansible do only on <=2 GB boards (Pi 4). 4 GB boards (Pi 5) have
    # ample headroom and get no reservation.
    mem_reservation: ${REDWING_DAEMON_MEM_RESERVATION:-0}
    privileged: false
    # No devices: binding — entrypoint-daemon.sh creates all device nodes and
    # symlinks from /host-dev at startup, so the container starts even when
    # the Pico or other peripherals are not plugged in.
    device_cgroup_rules:
      - "c 166:* rmw"   # ttyACM devices (RP2040)
      - "c 188:* rmw"   # ttyUSB devices (RPLidar USB adapter)
      - "c 81:* rmw"    # Video4Linux devices (camera)
      - "c 13:* rw"     # input devices (gamepads)
      - "c 89:* rw"     # I2C devices (battery monitor, HAT sensors)
      - "c 189:* rmw"   # USB raw bus devices (picotool → BOOTSEL flashing)
    pid: "host"          # share host PID namespace — required for shutdown/reboot
    cap_add:
      - MKNOD            # lets entrypoint-daemon.sh create /dev/video* nodes
      - SYS_BOOT         # allows reboot() syscall to reach the host Pi
      # NOTE: NET_ADMIN was tried here to let libusb's udev hotplug monitor
      # thread subscribe to netlink uevents, on the theory that a single
      # picotool process's device list goes stale after its first USB scan.
      # Confirmed present on a running container and made no difference —
      # that theory was wrong (or at least insufficient), so it was removed
      # rather than keep an unproven capability grant around. The actual fix
      # (daemon/api.py) runs picotool twice as separate OS processes instead,
      # since a brand-new process's first scan is reliably correct.
    volumes:
      - student_workspace:/workspace
      - /dev:/host-dev:ro  # read-only view of host /dev; entrypoint creates device nodes
      - /dev/input:/dev/input
      # firmware/redwing.uf2 is committed to git by `firmware/build.sh` (see
      # the README) — a `git pull` on the Pi is enough to update it, no build
      # tooling needed on the Pi itself. Mounting the whole directory (rather
      # than just that one file) means this doesn't depend on the file
      # already existing when the container first starts — Docker would
      # otherwise create an empty directory in its place.
      # NOT read-only: confirmed on hardware that picotool's `load` fails to
      # open the .uf2 with a read-only bind mount (plain `cat` on the same
      # file succeeds fine, so it's not a permissions issue — picotool
      # opens/maps it in a mode that needs the mount to allow writes, even
      # though it never actually needs to modify this file).
      - ../firmware:/app/firmware
      # Read-only repo mount (mirrors code-server's own mount below) so the
      # System tab's Version card can read the actual checked-out commit via
      # `git -C /opt/redwing` — see daemon/sysinfo.py.
      - ..:/opt/redwing:ro
    environment:
      REDWING_SERIAL: /dev/rp2040
      REDWING_HOST:   "0.0.0.0"
      REDWING_PORT:   "8000"
      REDWING_HZ:     "50"
      REDWING_LIDAR: /dev/ttyUSB0
      REDWING_FIRMWARE_UF2: /app/firmware/redwing.uf2
      # REDWING_BATTERY_CELLS: "4"  # set per-robot if battery module has internal voltage divider
      # Cap numpy/BLAS/OpenMP thread pools (OpenCV's own pool is capped via
      # REDWING_CV_THREADS). Keeps the vision daemon from oversubscribing the
      # 4 cores it shares with code-server + student code on a Pi 4.
      OMP_NUM_THREADS:      "2"
      OPENBLAS_NUM_THREADS: "2"
    network_mode: host   # ports: is redundant with host networking

  nginx:
    image: nginx:alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - daemon
      - code-server

  code-server:
    image: redwing-code-server:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.code-server
    restart: unless-stopped
    volumes:
      - student_workspace:/home/coder/project
      - ..:/opt/redwing:ro
    environment:
      PASSWORD: "redwing"     # change per-robot in ansible vars
      # Cap numpy/BLAS/OpenMP thread pools for student code. Combined with the
      # OpenCV thread cap in the redwing library, this keeps a student's vision
      # work (e.g. AprilTag detection) to ~2 cores so it can't starve the
      # daemon's camera-feed loop and make the feed stutter on a 4-core Pi 4.
      OMP_NUM_THREADS:      "2"
      OPENBLAS_NUM_THREADS: "2"
    network_mode: host   # listens on port 8080 (code-server default)

volumes:
  student_workspace:
    # This named volume persists student code across container restarts and image updates.
    # It lives on the Pi's filesystem — NOT inside the container.
    driver: local
