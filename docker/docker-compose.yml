name: redwing

services:
  daemon:
    image: redwing-daemon:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    privileged: false
    # No devices: binding — entrypoint-daemon.sh creates all device nodes and
    # symlinks from /host-dev at startup, so the container starts even when
    # the Pico or other peripherals are not plugged in.
    device_cgroup_rules:
      - "c 166:* rmw"   # ttyACM devices (RP2040)
      - "c 188:* rmw"   # ttyUSB devices (RPLidar USB adapter)
      - "c 81:* rmw"    # Video4Linux devices (camera)
      - "c 13:* rw"     # input devices (gamepads)
      - "c 89:* rw"     # I2C devices (battery monitor, HAT sensors)
    pid: "host"          # share host PID namespace — required for shutdown/reboot
    cap_add:
      - MKNOD            # lets entrypoint-daemon.sh create /dev/video* nodes
      - SYS_BOOT         # allows reboot() syscall to reach the host Pi
    volumes:
      - student_workspace:/workspace
      - /dev:/host-dev:ro  # read-only view of host /dev; entrypoint creates device nodes
      - /dev/input:/dev/input
    environment:
      REDWING_SERIAL: /dev/rp2040
      REDWING_HOST:   "0.0.0.0"
      REDWING_PORT:   "8000"
      REDWING_HZ:     "50"
      REDWING_LIDAR: /dev/ttyUSB0
      # REDWING_BATTERY_CELLS: "4"  # set per-robot if battery module has internal voltage divider
      # Cap numpy/BLAS/OpenMP thread pools (OpenCV's own pool is capped via
      # REDWING_CV_THREADS). Keeps the vision daemon from oversubscribing the
      # 4 cores it shares with code-server + student code on a Pi 4.
      OMP_NUM_THREADS:      "2"
      OPENBLAS_NUM_THREADS: "2"
    network_mode: host   # ports: is redundant with host networking

  nginx:
    image: nginx:alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - daemon
      - code-server

  code-server:
    image: redwing-code-server:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.code-server
    restart: unless-stopped
    volumes:
      - student_workspace:/home/coder/project
      - ..:/opt/redwing:ro
    environment:
      PASSWORD: "redwing"     # change per-robot in ansible vars
      # Cap numpy/BLAS/OpenMP thread pools for student code. Combined with the
      # OpenCV thread cap in the redwing library, this keeps a student's vision
      # work (e.g. AprilTag detection) to ~2 cores so it can't starve the
      # daemon's camera-feed loop and make the feed stutter on a 4-core Pi 4.
      OMP_NUM_THREADS:      "2"
      OPENBLAS_NUM_THREADS: "2"
    network_mode: host   # listens on port 8080 (code-server default)

volumes:
  student_workspace:
    # This named volume persists student code across container restarts and image updates.
    # It lives on the Pi's filesystem — NOT inside the container.
    driver: local
