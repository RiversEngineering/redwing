name: redwing

services:
  daemon:
    image: ghcr.io/riversengineering/redwing:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    privileged: false
    devices:
      # RP2040 over USB serial — udev rule creates stable symlink /dev/rp2040
      # See docs/pi-setup.md for the udev rule.
      - /dev/rp2040:/dev/rp2040
    device_cgroup_rules:
      - "c 166:* rmw"   # ttyACM devices (RP2040)
      - "c 81:* rmw"    # Video4Linux devices (camera — accessible when plugged in)
      - "c 13:* rw"     # input devices (gamepads)
    # Camera (/dev/video0) is NOT listed under devices: — Docker refuses to start
    # if the device doesn't exist.  The cgroup rule above grants access whenever
    # a camera is plugged in; the daemon detects it automatically via OpenCV.
    volumes:
      - student_workspace:/workspace
      - /dev/input:/dev/input
    environment:
      REDWING_SERIAL: /dev/rp2040
      REDWING_HOST:   "0.0.0.0"
      REDWING_PORT:   "8000"
      REDWING_HZ:     "50"
    network_mode: host   # ports: is redundant with host networking

  code-server:
    image: ghcr.io/riversengineering/redwing-code-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.code-server
    restart: unless-stopped
    volumes:
      - student_workspace:/home/coder/project
      - ..:/opt/redwing:ro
    environment:
      PASSWORD: "redwing"     # change per-robot in ansible vars
    network_mode: host   # listens on port 8080 (code-server default)

volumes:
  student_workspace:
    # This named volume persists student code across container restarts and image updates.
    # It lives on the Pi's filesystem — NOT inside the container.
    driver: local
