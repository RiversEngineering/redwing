# Install to /etc/dnsmasq.d/redwing-bridge.conf — see ../../README.md.
#
# A narrowly-scoped dnsmasq instance that ONLY serves the Semaphore Docker
# bridge network (172.28.55.0/24, fixed in docker-compose.yml). It does not
# touch the Pi's own DNS resolution in any way — that stays exactly as it
# was before this existed.
#
# Why this exists: the official Semaphore image is Alpine-based (musl libc),
# which has no support for glibc-style pluggable NSS modules — the usual
# "apt install libnss-mdns" fix for .local resolution in a container simply
# doesn't apply. This bridges the gap: the host already resolves .local
# names fine via its own Avahi (confirmed working independently of any of
# this), and redwing-mdns-hosts.conf (kept fresh by refresh-mdns-hosts.sh)
# re-serves those as plain DNS records any container can query regardless
# of its libc.

# bind-dynamic (not bind-interfaces): the Docker bridge's gateway address
# doesn't exist yet at boot — it's created when `docker compose up` runs,
# which happens after dnsmasq starts. bind-dynamic picks up the interface
# once it appears instead of failing to bind at startup.
bind-dynamic
listen-address=172.28.55.1

# Don't use the host's /etc/resolv.conf for upstream queries — be fully
# explicit about where non-.local queries go, independent of whatever the
# host's own resolver configuration happens to be at any given moment.
no-resolv
server=10.105.0.1
