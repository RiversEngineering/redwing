name: redwing-fleet-control

# Semaphore UI — the web dashboard for running ansible/playbooks/deploy.yml
# against the robot fleet. Runs on the Pi 3 control node.
#
# Setup:
#   cp .env.example .env
#   # fill in .env (see comments inside it), then:
#   docker compose up -d
#   # open http://<pi3-hostname-or-ip>:3000
#
# See ../README.md for the one-time project setup inside the web UI
# (SSH key, repository, inventory, template).

services:
  semaphore:
    image: docker.io/semaphoreui/semaphore:${SEMAPHORE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN_USERNAME:-admin}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?set SEMAPHORE_ADMIN_PASSWORD in .env}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@localhost}
      # Leave unset for plain IP/hostname access — Semaphore then serves
      # index.html's <base href> as "/" and resolves assets against
      # whatever host the browser actually used. Only set this (in .env) if
      # you put Semaphore behind a reverse proxy or a fixed public URL later;
      # upstream's example defaults it to http://0.0.0.0:3000, which gets
      # baked into <base href> verbatim and breaks asset loading for anyone
      # connecting by IP or hostname, since 0.0.0.0 isn't browser-routable.
      SEMAPHORE_WEB_ROOT: ${SEMAPHORE_WEB_ROOT:-}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?set SEMAPHORE_ACCESS_KEY_ENCRYPTION in .env}
      SEMAPHORE_DB_DIALECT: sqlite
      # The database file lives inside /var/lib/semaphore (not a separate
      # volume) because that's the only data directory the image's non-root
      # container user (uid 1001) actually owns — anything else 403s.
      # SEMAPHORE_DB_HOST is the real env var for the sqlite file path;
      # SEMAPHORE_DB_PATH (used in some older upstream examples) isn't read.
      SEMAPHORE_DB_HOST: /var/lib/semaphore/database.db
      # Semaphore's Schedules feature (cron-based template triggers, e.g. a
      # nightly auto-shutdown) defaults to UTC — override in .env if
      # America/New_York isn't right, or a scheduled "6pm" will actually
      # fire at 6pm UTC (2pm Eastern). See the IANA tz database for valid
      # names.
      SEMAPHORE_SCHEDULE_TIMEZONE: ${SEMAPHORE_SCHEDULE_TIMEZONE:-America/New_York}
    volumes:
      - semaphore-data:/var/lib/semaphore
    # Alpine (this image's base) has no mDNS support at all — musl libc
    # doesn't support glibc-style pluggable NSS modules, so .local names in
    # inventory.yml can't resolve inside this container by any of the usual
    # tricks. Instead point DNS at the dnsmasq bridge on the host (see
    # mdns-bridge/ in this directory) — it resolves .local names via the
    # host's own working Avahi and re-serves them as plain DNS, which works
    # from any container regardless of libc. Uses a fixed subnet (below) so
    # the bridge has one predictable, documented address to listen on,
    # instead of whatever Docker happens to assign.
    dns:
      - 172.28.55.1
    networks:
      default:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.55.0/24
          gateway: 172.28.55.1

volumes:
  semaphore-data:
