---
# Deploy or update Redwing on all robots.
# Usage:
#   ansible-playbook -i ../inventory.yml deploy.yml
#   ansible-playbook -i ../inventory.yml deploy.yml --limit robot1

- name: Deploy Redwing
  hosts: all
  become: true

  tasks:
    - name: Install prerequisites for Docker apt repo
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /usr/share/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg \
          | gpg --dearmor -o /usr/share/keyrings/docker.gpg
        chmod a+r /usr/share/keyrings/docker.gpg
      args:
        creates: /usr/share/keyrings/docker.gpg

    - name: Add Docker apt repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker.gpg] \
          https://download.docker.com/linux/debian \
          $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Add pi user to docker group
      user:
        name: pi
        groups: docker
        append: true

    # ── zram swap ──────────────────────────────────────────────────────────
    # The full stack (code-server + Pylance, the vision daemon, and a student's
    # own OpenCV/AprilTag script) can transiently exceed the 2 GB on a Pi 4;
    # without swap a spike lets the OOM killer take a process.
    #
    # Raspberry Pi OS already ships compressed zram swap via
    # systemd-zram-generator (the "rpi-swap" units), so we rely on that. We must
    # NOT install zram-tools: a second provider on the same /dev/zram0 conflicts
    # and fails at boot ("device busy"). Remove it if present, and provision
    # zram natively only if the image ships without any zram swap.
    - name: Remove conflicting zram-tools if present
      apt:
        name: zram-tools
        state: absent
        purge: true

    - name: Check whether zram swap is already active
      command: swapon --show=NAME --noheadings
      register: redwing_active_swaps
      changed_when: false

    - name: Provision zram natively when the image ships without it
      when: "'zram' not in redwing_active_swaps.stdout"
      block:
        - name: Install systemd-zram-generator
          apt:
            name: systemd-zram-generator
            state: present
            update_cache: true

        - name: Configure zram device (systemd-zram-generator)
          copy:
            dest: /etc/systemd/zram-generator.conf
            mode: "0644"
            content: |
              # Managed by Redwing ansible — compressed in-RAM swap.
              [zram0]
              zram-size = ram
              compression-algorithm = zstd
              swap-priority = 100

    - name: Install udev rule for RP2040 stable symlink
      copy:
        src: ../../docker/99-rp2040.rules
        dest: /etc/udev/rules.d/99-rp2040.rules
        mode: "0644"
      notify: reload udev

    - name: Create workspace directory (persists student code)
      file:
        path: /home/pi/workspace
        state: directory
        owner: pi
        mode: "0755"

    - name: Copy project files
      synchronize:
        src: ../../
        dest: /opt/redwing/
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=firmware/build"
          - "--exclude=dashboard/node_modules"
          - "--exclude=dashboard/dist"

    # Give the robot daemon a soft memory-protection floor on low-RAM boards so
    # the camera feed / control loop survive memory pressure (see mem_reservation
    # in docker-compose.yml). Only <=2 GB boards (Pi 4) get it; 4 GB boards (Pi 5)
    # have ample headroom and get 0 (no reservation).
    - name: Determine daemon memory reservation from board RAM
      set_fact:
        daemon_mem_reservation: "{{ '384m' if (ansible_memtotal_mb | int) <= 2560 else '0' }}"

    - name: Build Docker images from synced source
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        pull: missing
        build: true
        state: present
      environment:
        REDWING_DAEMON_MEM_RESERVATION: "{{ daemon_mem_reservation }}"

    - name: Ensure redwing daemon is running
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        state: present
      environment:
        REDWING_DAEMON_MEM_RESERVATION: "{{ daemon_mem_reservation }}"

  handlers:
    - name: reload udev
      command: udevadm control --reload-rules && udevadm trigger


- name: Restore a student's workspace (reset a single robot)
  hosts: all
  become: true
  tags: [restore]

  tasks:
    - name: Stop containers
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        state: stopped

    - name: Clear student workspace
      file:
        path: /home/pi/workspace
        state: absent

    - name: Recreate empty workspace
      file:
        path: /home/pi/workspace
        state: directory
        owner: pi
        mode: "0755"

    - name: Restart containers
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        state: present
