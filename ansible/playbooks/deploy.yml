---
# Deploy or update Redwing on all robots.
# Pulls the latest `main` straight from GitHub on each robot (no local
# checkout needed on the control node), then rebuilds and restarts Docker.
#
# Usage (from the repo root — ansible.cfg supplies the default inventory):
#   ansible-playbook ansible/playbooks/deploy.yml
#   ansible-playbook ansible/playbooks/deploy.yml --limit robot1

- name: Deploy Redwing
  hosts: all
  become: true

  tasks:
    - name: Install prerequisites for Docker apt repo
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /usr/share/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg \
          | gpg --dearmor -o /usr/share/keyrings/docker.gpg
        chmod a+r /usr/share/keyrings/docker.gpg
      args:
        creates: /usr/share/keyrings/docker.gpg

    - name: Add Docker apt repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker.gpg] \
          https://download.docker.com/linux/debian \
          $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Add pi user to docker group
      user:
        name: pi
        groups: docker
        append: true

    - name: Install udev rule for RP2040 stable symlink
      copy:
        src: ../../docker/99-rp2040.rules
        dest: /etc/udev/rules.d/99-rp2040.rules
        mode: "0644"
      notify: reload udev

    - name: Create workspace directory (persists student code)
      file:
        path: /home/pi/workspace
        state: directory
        owner: pi
        mode: "0755"

    - name: Install git
      apt:
        name: git
        state: present

    - name: Pull latest source from GitHub
      git:
        repo: https://github.com/RiversEngineering/redwing
        dest: /opt/redwing
        version: main
        force: true

    - name: Ensure /opt/redwing ownership matches the pi user
      file:
        path: /opt/redwing
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true

    - name: Build Docker images from pulled source
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        pull: missing
        build: true
        state: present

    - name: Ensure redwing daemon is running
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        state: present

  handlers:
    - name: reload udev
      command: udevadm control --reload-rules && udevadm trigger


- name: Restore a student's workspace (reset a single robot)
  hosts: all
  become: true
  tags: [restore]

  tasks:
    - name: Stop containers
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        state: stopped

    - name: Clear student workspace
      file:
        path: /home/pi/workspace
        state: absent

    - name: Recreate empty workspace
      file:
        path: /home/pi/workspace
        state: directory
        owner: pi
        mode: "0755"

    - name: Restart containers
      community.docker.docker_compose_v2:
        project_src: /opt/redwing/docker
        state: present
