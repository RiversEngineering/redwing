---
# Ansible Galaxy collections required by the playbooks in ansible/playbooks/.
# Install locally with: ansible-galaxy install -r requirements.yml
# Semaphore installs this automatically before each run (it looks for
# requirements.yml at the repository root).
collections:
  - name: community.docker
    version: ">=3.0.0"
  - name: community.general
    version: ">=8.0.0"
